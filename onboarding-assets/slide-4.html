  <!-- GSAP via cdnjs (swap for `npm i gsap` in the Angular app) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
  (function () {
    if (!window.gsap) return;

    const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const line = document.querySelector('#trendline');
    let master;

    // --- Intro timeline (one shot; settles and holds) --------------------
    function play() {
      const len = line.getTotalLength();
      gsap.set(line, { strokeDasharray: len, strokeDashoffset: len });

      master = gsap.timeline({ defaults: { ease: 'power3.out' } });

      master
        // 1 — bars grow up out of the screen baseline
        .from('.bar', {
          scaleY: 0, transformOrigin: '50% 100%',
          duration: 0.8, stagger: 0.12, ease: 'power3.out'
        }, 0)
        // 2 — trend line trims on and stops at the end point
        .to(line, { strokeDashoffset: 0, duration: 1.2, ease: 'power1.inOut' }, 0.4)
        // 3 — icons reveal in place by opacity, timed to the line sweep
        .from('.icon', {
          autoAlpha: 0, duration: 0.55, ease: 'power1.out', stagger: 0.3
        }, 0.55)
        // 4 — arrowhead fades in at the tip once the line lands
        .from('#arrowhead', { autoAlpha: 0, duration: 0.4, ease: 'power1.out' }, '>-0.25');
    }

    // --- Reduced motion: final state, no movement ------------------------
    function staticState() {
      gsap.set('.bar', { scaleY: 1 });
      gsap.set(['.icon', '#arrowhead'], { autoAlpha: 1 });
      gsap.set(line, { strokeDasharray: 'none', strokeDashoffset: 0 });
    }

    if (REDUCED) staticState(); else play();

    const btn = document.getElementById('replayBtn');
    if (btn) btn.addEventListener('click', function () {
      if (master) master.kill();
      play();
    });
  })();
  </script>

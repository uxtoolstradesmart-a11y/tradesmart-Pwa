<script>
(function(){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function setStart(){
    gsap.set('#art svg',{opacity:0, y:60, scale:.9, rotationX:14, transformOrigin:'50% 60%'});
    gsap.set('.bar',{scaleY:0, transformOrigin:'50% 100%'});
    gsap.set('.row',{opacity:0, y:6});
    gsap.set('#arrowFill',{opacity:0, scale:.55, y:5, transformOrigin:'0% 100%'});
    gsap.set('#btnBuy, #btnSell',{scale:0, transformOrigin:'50% 50%'});
    gsap.set('#hand',{x:140, y:155, rotation:7, opacity:0, transformOrigin:'90% 90%'});
    gsap.set('#glare',{x:-120});
  }
  function setEnd(){
    gsap.set('#art svg',{opacity:1, y:0, scale:1, rotationX:0});
    gsap.set('.bar',{scaleY:1});
    gsap.set('.row',{opacity:1, y:0});
    gsap.set('#arrowFill',{opacity:.6, scale:1, y:0});
    gsap.set('#btnBuy, #btnSell',{scale:1});
    gsap.set('#hand',{x:0, y:0, rotation:0, opacity:1});
  }

  function play(){
    setStart();
    const tl = gsap.timeline({defaults:{ease:'power3.out'}, onComplete:setEnd});

    tl.to('#art svg',{opacity:1, y:0, scale:1, rotationX:0, duration:1.05, ease:'expo.out'}, .05);
    tl.to('.row',{opacity:1, y:0, duration:.4, stagger:.07}, .55);
    tl.to('.bar',{scaleY:1, duration:.8, ease:'back.out(1.9)', stagger:.13}, .6);

    // arrow reveals on its own — pop up from its tail with a brief glow
    tl.to('#arrowFill',{opacity:.6, scale:1, y:0, duration:.6, ease:'back.out(2)'}, 1.0);
    tl.fromTo('#arrowFill',{filter:'drop-shadow(0 0 0 rgba(0,180,142,0))'},
      {filter:'drop-shadow(0 0 7px rgba(0,180,142,.8))', duration:.28, yoyo:true, repeat:1, ease:'sine.inOut'}, 1.15);

    tl.to('#btnBuy, #btnSell',{scale:1, duration:.55, ease:'back.out(2.4)', stagger:.1}, 1.5);
    tl.fromTo('#glare',{x:-120},{x:240, duration:.95, ease:'power2.inOut'}, 1.6);

    // hand glides in and taps (no ripple)
    tl.to('#hand',{x:0, y:0, rotation:0, opacity:1, duration:.7, ease:'power3.out'}, 1.85);
    tl.add('tap', 2.5);
    tl.to('#hand',{y:'-=7', x:'-=4', duration:.14, ease:'power2.in'}, 'tap-=0.14');
    tl.to('#hand',{y:'+=7', x:'+=4', duration:.4, ease:'elastic.out(1,.5)'}, 'tap');
    // tapped bar gives a little confirm
    tl.to('#bar2',{scaleY:1.06, duration:.16, ease:'power2.out', transformOrigin:'50% 100%'}, 'tap');
    tl.to('#bar2',{scaleY:1, duration:.5, ease:'elastic.out(1,.45)'}, 'tap+=0.16');

    return tl;
  }

  if(reduce){ setEnd(); } else { play(); }
  document.getElementById('replay').addEventListener('click', play);
})();
</script>

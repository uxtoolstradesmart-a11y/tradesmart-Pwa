<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Customer Support — Animated</title>

<!--
==================================================================================
  TradeSmart · "Live Customer Support" — animated illustration
  ----------------------------------------------------------------------------------
  WHAT THIS IS
  A single, self-contained file. The original undraw SVG, untouched in its artwork,
  wrapped in named <g> groups and orchestrated with a GSAP timeline.

  MOTION DESIGN (why each beat exists)
    1. blob          fades + settles in (sets the stage)
    2. phone         rises and lands with a soft overshoot
    3. agent         avatar pops onto the screen
    4. live pip      green "online" dot + expanding ping  → the LIVE signal (loops)
    5. headset rep   slides up from below, ear-cups pop
    6. bubble (rep)  pops in, then its lines "type" via a left-anchored width reveal
    7. bubble (cust) pops in and types the reply
    AMBIENT LOOP: gentle breathing float + the rep & customer keep "typing" on a
                  cycle, so the scene reads as an ongoing live conversation.

  THE ONE ADDED ELEMENT
    Everything is from the source SVG except <g id="live"> (green online pip + ping).
    It's the single "live" signature. To ship the artwork 100% untouched, delete that
    <g id="live"> node and the liveLoop()/ping tween — nothing else depends on it.

  ANGULAR HANDOFF
    • Drop the <svg> into your component template (it's pure markup, no inline JS).
    • npm i gsap ; move the script into the component:
        @ViewChild('scene') scene!: ElementRef<HTMLElement>;
        private ctx?: gsap.Context;
        ngAfterViewInit() {
          this.ctx = gsap.context(() => play(this.scene.nativeElement), this.scene.nativeElement);
        }
        ngOnDestroy() { this.ctx?.revert(); }   // kills tweens, restores DOM
      Scope every selector to the host (querySelectorAll within the svg) so multiple
      instances don't cross-animate. gsap.context() already does this for you.
    • Bootstrap: nothing here fights Bootstrap; the wrapper is a plain flex box.

  ACCESSIBILITY
    • prefers-reduced-motion: respected — no entrance, no loops, final state shown.
    • svg is role="img" with an aria-label; decorative sub-parts are aria-hidden.
    • Keyboard-focusable Replay control with visible focus ring.

  TRIGGERING
    • Plays once when the section scrolls into view (IntersectionObserver), and on
      Replay. For an always-on hero, call play() directly on load instead.
==================================================================================
-->

<style>
  :root{
    --ts-ink:#151E34;
    --ts-blue:#3F71EB;
    --ts-green:#00B48E;
    --ts-paper:#F7F9FE;
    --ts-line:#E6E6E6;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ts-ink);
    padding:0;
  }

  /* The illustration card. Transparent SVG sits inside; remove the card chrome
     freely when embedding into an existing section. */
  .stage{
    width:min(440px,100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }

  .scene{
    width:100%;
    aspect-ratio:336 / 301;
    display:grid;
    place-items:center;
    background:transparent;
    border-radius:24px;
    padding:26px;
    box-shadow:none;
  }

  .scene svg{
    width:100%;
    height:auto;
    overflow:visible;            /* let the ping breathe past the avatar */
    visibility:visible;          /* static fallback if the animation library is unavailable */
  }

  /* Replay control — minimal, optional. Safe to delete for a live section. */
  .replay{
    display:none!important;
    appearance:none;
    border:1px solid rgba(21,30,52,.14);
    background:#fff;
    color:var(--ts-ink);
    font:inherit;
    font-size:13px;
    font-weight:600;
    letter-spacing:.01em;
    padding:9px 16px 9px 13px;
    border-radius:999px;
    display:inline-flex;
    align-items:center;
    gap:7px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .replay:hover{ border-color:rgba(63,113,235,.5); box-shadow:0 6px 16px -8px rgba(63,113,235,.55); transform:translateY(-1px); }
  .replay:active{ transform:translateY(0); }
  .replay:focus-visible{ outline:2px solid var(--ts-blue); outline-offset:2px; }
  .replay svg{ width:14px; height:14px; visibility:visible; }
  .replay .dot{ width:7px; height:7px; border-radius:50%; background:var(--ts-green); box-shadow:0 0 0 0 rgba(0,180,142,.5); }

  .caption{
    font-size:12.5px;
    color:#7A839A;
    letter-spacing:.02em;
  }

  @media (prefers-reduced-motion: reduce){
    .scene svg{ visibility:visible; }   /* JS also enforces final state */
  }
</style>
</head>

      <span class="dot" aria-hidden="true"></span>
      Replay
    </button>
    <div class="caption">Live customer support · animated section</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
  (function () {
    const svg     = document.getElementById('scene');
    const reduce  = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const topLines = svg.querySelectorAll('#bubble-top .type-line');
    const botLines = svg.querySelectorAll('#bubble-bottom .type-line');

    let intro, ambient = [];

    // Drop the whole scene into its resting "all visible" state.
    function showFinal() {
      gsap.set(svg, { visibility: 'visible' });
      gsap.set('#blob',   { opacity: 0.44, scale: 1 });
      gsap.set('#phone',  { opacity: 1, y: 0, scale: 1 });
      gsap.set('#agent',  { opacity: 1, y: 0, scale: 1 });
      gsap.set('#customer', { opacity: 1, y: 0 });
      gsap.set(['#hs-left', '#hs-right'], { scale: 1 });
      gsap.set(['#bubble-top', '#bubble-bottom'], { opacity: 1, scale: 1 });
      gsap.set(['#bt-dot', '#bb-dot'], { scale: 1 });
      gsap.set([...topLines, ...botLines], { scaleX: 1 });
      gsap.set('#live-dot', { scale: 1, opacity: 1 });
      gsap.set('#live-ping', { opacity: 0 });
    }

    // Kill any running ambient/intro so Replay starts clean.
    function clearAll() {
      if (intro) intro.kill();
      ambient.forEach(t => t.kill());
      ambient = [];
    }

    function setInitial() {
      gsap.set(svg, { visibility: 'visible' });
      gsap.set('#blob',   { opacity: 0, scale: 0.92, transformOrigin: '50% 50%' });
      gsap.set('#phone',  { opacity: 0, y: 34, scale: 0.96, transformOrigin: '50% 62%' });
      gsap.set('#agent',  { opacity: 0, scale: 0.55, transformOrigin: '185px 98px' });
      gsap.set('#customer', { opacity: 0, y: 46, transformOrigin: '149px 259px' });
      gsap.set(['#hs-left', '#hs-right'], { scale: 0.4, transformOrigin: '50% 0%' });
      gsap.set('#bubble-top',    { opacity: 0, scale: 0.6, transformOrigin: '88% 100%' });
      gsap.set('#bubble-bottom', { opacity: 0, scale: 0.6, transformOrigin: '6% 100%' });
      gsap.set(['#bt-dot', '#bb-dot'], { scale: 0, transformOrigin: '50% 50%' });
      gsap.set([...topLines, ...botLines], { scaleX: 0, transformOrigin: '0% 50%' });
      gsap.set('#live-dot',  { scale: 0, opacity: 1, transformOrigin: '50% 50%' });
      gsap.set('#live-ping', { opacity: 0, transformOrigin: '50% 50%' });
    }

    // Continuous "this is live" behaviours: ping, breathing float, ongoing typing.
    function startAmbient() {
      // online ping
      ambient.push(
        gsap.fromTo('#live-ping',
          { scale: 0.7, opacity: 0.55 },
          { scale: 2.8, opacity: 0, duration: 1.9, ease: 'power2.out', repeat: -1, transformOrigin: '50% 50%' })
      );
      // gentle breathing of the three actors (different periods = organic)
      ambient.push(gsap.to('#agent',         { y: '-=3',   duration: 2.6, ease: 'sine.inOut', yoyo: true, repeat: -1 }));
      ambient.push(gsap.to('#bubble-top',    { y: '-=2.5', duration: 2.9, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: 0.35 }));
      ambient.push(gsap.to('#bubble-bottom', { y: '+=2.5', duration: 3.1, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: 0.6 }));
      ambient.push(gsap.to('#customer',      { y: '-=2',   duration: 3.3, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: 0.5 }));

      // ongoing conversation: customer types a reply, then the rep follows, forever.
      const chat = gsap.timeline({ repeat: -1, delay: 2.4 });
      chat
        // — customer replies —
        .set(botLines, { scaleX: 0 })
        .to('#bubble-bottom', { scale: 1.045, duration: 0.16, transformOrigin: '6% 100%', ease: 'power2.out' })
        .to('#bubble-bottom', { scale: 1, duration: 0.32, ease: 'power2.out' })
        .to(botLines, { scaleX: 1, duration: 0.42, stagger: 0.16, ease: 'power2.out' }, '<')
        .to({}, { duration: 1.8 })
        // — rep answers —
        .set(topLines, { scaleX: 0 })
        .to('#bubble-top', { scale: 1.045, duration: 0.16, transformOrigin: '88% 100%', ease: 'power2.out' })
        .to('#bubble-top', { scale: 1, duration: 0.32, ease: 'power2.out' })
        .to(topLines, { scaleX: 1, duration: 0.42, stagger: 0.16, ease: 'power2.out' }, '<')
        .to({}, { duration: 1.8 });
      ambient.push(chat);
    }

    function play() {
      if (reduce) { showFinal(); return; }
      clearAll();
      setInitial();

      intro = gsap.timeline({
        defaults: { ease: 'power3.out' },
        onComplete: startAmbient
      });

      intro
        .to('#blob',   { opacity: 0.44, scale: 1, duration: 0.9, ease: 'power2.out' }, 0)
        .to('#phone',  { opacity: 1, y: 0, scale: 1, duration: 0.85, ease: 'back.out(1.4)' }, 0.15)
        .to('#agent',  { opacity: 1, scale: 1, duration: 0.7, ease: 'back.out(1.7)' }, 0.5)
        .to('#live-dot', { scale: 1, duration: 0.45, ease: 'back.out(2.4)' }, 0.95)
        .to('#customer', { opacity: 1, y: 0, duration: 0.8, ease: 'back.out(1.3)' }, 0.7)
        .to(['#hs-left', '#hs-right'], { scale: 1, duration: 0.5, ease: 'back.out(2.2)', stagger: 0.08 }, 1.05)
        // rep bubble pops, dot pops, lines type
        .to('#bubble-top', { opacity: 1, scale: 1, duration: 0.55, ease: 'back.out(2)' }, 1.2)
        .to('#bt-dot', { scale: 1, duration: 0.4, ease: 'back.out(2.6)' }, 1.45)
        .to(topLines, { scaleX: 1, duration: 0.45, stagger: 0.16, ease: 'power2.out' }, 1.55)
        // customer bubble pops + types the reply
        .to('#bubble-bottom', { opacity: 1, scale: 1, duration: 0.55, ease: 'back.out(2)' }, 1.85)
        .to('#bb-dot', { scale: 1, duration: 0.4, ease: 'back.out(2.6)' }, 2.1)
        .to(botLines, { scaleX: 1, duration: 0.45, stagger: 0.16, ease: 'power2.out' }, 2.2);
    }

    // Play once when scrolled into view (good for a section). Swap for play()
    // on load if this is an always-on hero.
    if (reduce) {
      showFinal();
    } else if ('IntersectionObserver' in window) {
      let fired = false;
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting && !fired) { fired = true; play(); io.disconnect(); }
        });
      }, { threshold: 0.4 });
      io.observe(svg);
    } else {
      play();
    }

    document.getElementById('replay').addEventListener('click', play);
  })();
  </script>

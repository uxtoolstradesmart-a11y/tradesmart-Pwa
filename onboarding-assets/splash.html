<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeSmart — Splash</title>
<style>
  /* =========================================================
     TradeSmart Splash Screen — 2s intro + idle loop
     Stack-safe: plain CSS keyframes, no JS required for motion.
     (The small JS block at the bottom is only the preview
      replay button — remove for production.)
     ========================================================= */

  :root{
    --ts-navy:  #151E34;
    --ts-blue:  #3F71EB;
    --ts-red:   #E02B59;
    --ts-gold:  #EEB268;
    --ts-green: #00B48E;
    --splash-bg: #FFFFFF;

    /* master timing — tweak here */
    --t-bars:     0.50s;  /* each bar's grow duration            */
    --t-letters:  0.40s;  /* each letter's reveal duration       */
    --d-slide:    0.60s;  /* mark starts sliding left            */
    --t-slide:    0.50s;  /* slide duration                      */
    --d-words:    0.82s;  /* TRADE + SMART reveal together       */
    --d-sheen:    1.20s;  /* light sweep across the mark         */
    --d-idle:     1.85s;  /* breathing loop begins               */
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    background: var(--splash-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .splash{
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .splash svg{
    width: min(58vw, 300px);
    height: auto;
    overflow: visible;
  }

  /* ---------- 1. Mark: four strokes grow upward ---------- */

  .bar{
    transform-box: fill-box;
    transform-origin: 50% 100%;           /* grow from the base */
    transform: scale(0.001);
    opacity: 0;
    animation: barGrow var(--t-bars) cubic-bezier(0.34, 1.45, 0.45, 1) forwards;
  }

  .bar-gold  { animation-delay: 0.00s; }
  .bar-red   { animation-delay: 0.09s; }
  .bar-green { animation-delay: 0.18s; }
  .bar-blue  { animation-delay: 0.27s; }

  @keyframes barGrow{
    0%   { transform: scale(0.001); opacity: 0; }
    30%  { opacity: 1; }
    100% { transform: scale(1);     opacity: 1; }
  }

  /* ---------- 1b. Mark position: born centered, slides left ----------
     The mark is ~35 units wide inside a 91.59-unit lockup, so
     (91.59 − 35) / 2 ≈ 28.3 units of offset centers it.        */

  .mark-pos{
    transform: translateX(28.3px);
    animation: slideLeft var(--t-slide) cubic-bezier(0.65, 0, 0.25, 1) var(--d-slide) forwards;
  }

  @keyframes slideLeft{
    to{ transform: translateX(0); }
  }

  /* ---------- 2. Wordmark: letters rise from baseline ---------- */

  .ltr{
    transform-box: fill-box;
    transform-origin: 50% 100%;
    transform: translateX(-9px);
    opacity: 0;
    filter: blur(3px);
    animation: letterReveal var(--t-letters) cubic-bezier(0.22, 0.9, 0.3, 1) forwards;
  }

  @keyframes letterReveal{
    to{ transform: translateX(0); opacity: 1; filter: blur(0); }
  }

  /* per-letter stagger, left → right (SVG path order ≠ visual order,
     so delays are assigned explicitly per letter) */
  /* both rows share --d-words; the stagger runs per COLUMN, so the
     rows reveal in lockstep, sweeping left → right together */
  .t1{ animation-delay: calc(var(--d-words) + 0.00s); }  /* T */
  .t2{ animation-delay: calc(var(--d-words) + 0.04s); }  /* R */
  .t3{ animation-delay: calc(var(--d-words) + 0.08s); }  /* A */
  .t4{ animation-delay: calc(var(--d-words) + 0.12s); }  /* D */
  .t5{ animation-delay: calc(var(--d-words) + 0.16s); }  /* E */

  .s1{ animation-delay: calc(var(--d-words) + 0.00s); }  /* S */
  .s2{ animation-delay: calc(var(--d-words) + 0.04s); }  /* M */
  .s3{ animation-delay: calc(var(--d-words) + 0.08s); }  /* A */
  .s4{ animation-delay: calc(var(--d-words) + 0.12s); }  /* R */
  .s5{ animation-delay: calc(var(--d-words) + 0.16s); }  /* T */

  /* ---------- 3. Light sweep across the mark ---------- */

  .sheen{
    opacity: 0;
    animation: sheenSweep 0.6s ease-in-out var(--d-sheen) 1 forwards;
  }

  @keyframes sheenSweep{
    0%   { transform: translateX(-40px); opacity: 0;   }
    25%  { opacity: 0.85; }
    100% { transform: translateX(50px);  opacity: 0;   }
  }

  /* ---------- 4. Idle: gentle breathing on the mark ---------- */

  .mark{
    transform-box: fill-box;
    transform-origin: 50% 60%;
    animation: breathe 3.2s ease-in-out var(--d-idle) infinite;
  }

  @keyframes breathe{
    0%, 100% { transform: scale(1);     }
    50%      { transform: scale(1.02);  }
  }

  /* ---------- Accessibility ---------- */

  @media (prefers-reduced-motion: reduce){
    .bar, .ltr, .mark, .mark-pos{ animation: none; transform:none; opacity:1; filter:none; }
    .sheen{ display:none; }
  }

  /* ---------- Preview-only replay button (remove in prod) ---------- */
  .replay{
    display:none;
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    border: 1px solid #E3E7EF; background:#fff; color:#8A93A6;
    font-size: 12px; letter-spacing:.04em; padding: 8px 18px;
    border-radius: 999px; cursor: pointer; transition: color .2s, border-color .2s;
  }
  .replay:hover{ color: var(--ts-navy); border-color:#C7CEDB; }
</style>
</head>

      </g>

<!-- Preview-only replay control — remove this block for production -->
<button class="replay" onclick="replay()">Replay</button>
<script>
  function replay(){
    const el = document.getElementById('splash');
    const clone = el.cloneNode(true);
    el.parentNode.replaceChild(clone, el);
  }
</script>

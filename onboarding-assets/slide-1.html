<!DOCTYPE html>
<!--
  TradeSmart — Pre-login intro / splash mark  (v2 — more dynamics)
  ------------------------------------------------------------------
  Self-contained, zero-dependency (no JS, no GSAP, no Lottie).
  Paints instantly on first launch — no library-load flash.

  MOTION DESIGN
   • Entrance (once): each badge arcs in from its own direction with a
     slight rotation, overshoots, then settles. Staggered blue→teal→amber.
   • Float (infinite): each badge drifts along its OWN looping path (a slow
     organic meander, not a synced bob). Amplitude encodes depth — large
     blue moves most ("closest"), amber least ("farthest").
   • Specular glint: a soft highlight sweeps across each disc on a staggered
     rhythm, clipped to the disc — the "light catching glass" premium touch.
   • Halo breathe: soft outer rings gently scale + fade, off-phase.
   • Colour-matched drop-shadows give ambient depth (no UI element added).

  ANGULAR HANDOFF
   • Drop <svg.mark> into the component template; move <style> into the
     component .css (scoped to .stage / .mark).
   • Background lives on .stage. Set .stage{background:transparent} to overlay
     on your own splash, or flip --bg-1/--bg-2 (dark preset commented below).
   • Tune feel via the float*/glint*/breathe keyframes near the bottom.
   • prefers-reduced-motion respected (static, fully visible at rest).
   • Decorative mark: role="img" + aria-label; swap to aria-hidden="true" if a
     separate text logo carries the accessible name.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TradeSmart — Intro</title>
<style>
  :root{
    /* Light premium backdrop (default) */
    --bg-1:#ffffff;
    --bg-2:#eef1f6;

    /* Dark preset — uncomment to use:
    --bg-1:#0e1320;
    --bg-2:#070a12;
    */

    --ease-settle:cubic-bezier(.34,1.46,.44,1); /* gentle overshoot */
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }

  .stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    overflow:hidden;
  }

  .mark{
    width:clamp(184px, 42vw, 300px);
    height:auto;
    overflow:visible;                 /* let float + glow spill past the box */
  }

  .mark *{ transform-box:fill-box; }
  .enter, .bob, .halo, .glint{ transform-origin:50% 50%; }
  .glint{ opacity:0; }                 /* stays hidden until its own sweep begins */

  /* Ambient depth — colour-matched soft shadows (static) */
  .bob--teal  { filter:drop-shadow(0 6px 13px rgba(0,180,142,.30)); }
  .bob--amber { filter:drop-shadow(0 5px 11px rgba(224,170,90,.34)); }
  .bob--blue  { filter:drop-shadow(0 9px 20px rgba(63,113,235,.34)); }

  /* ---------- Entrance (once) — kinetic arc-in ---------- */
  @keyframes enterBlue{
    0%   { opacity:0; transform:translateY(28px) scale(.66) rotate(5deg); }
    55%  { opacity:1; }
    100% { opacity:1; transform:translateY(0) scale(1) rotate(0); }
  }
  @keyframes enterTeal{
    0%   { opacity:0; transform:translate(-24px,12px) scale(.66) rotate(-8deg); }
    55%  { opacity:1; }
    100% { opacity:1; transform:translate(0,0) scale(1) rotate(0); }
  }
  @keyframes enterAmber{
    0%   { opacity:0; transform:translate(22px,-10px) scale(.64) rotate(9deg); }
    55%  { opacity:1; }
    100% { opacity:1; transform:translate(0,0) scale(1) rotate(0); }
  }
  .enter--blue  { animation:enterBlue  1s var(--ease-settle) .05s both; }
  .enter--teal  { animation:enterTeal  1s var(--ease-settle) .20s both; }
  .enter--amber { animation:enterAmber 1s var(--ease-settle) .35s both; }

  /* ---------- Continuous float — organic looping drift ---------- */
  @keyframes floatBlue{
    0%   { transform:translate(0,0)       rotate(0); }
    22%  { transform:translate(4px,-6px)  rotate(-1deg); }
    46%  { transform:translate(-3px,-8px) rotate(.6deg); }
    68%  { transform:translate(-5px,2px)  rotate(1deg); }
    86%  { transform:translate(3px,6px)   rotate(-.5deg); }
    100% { transform:translate(0,0)       rotate(0); }
  }
  @keyframes floatTeal{
    0%   { transform:translate(0,0)       rotate(0); }
    20%  { transform:translate(-3px,4px)  rotate(.8deg); }
    44%  { transform:translate(2px,6px)   rotate(-.6deg); }
    64%  { transform:translate(4px,-2px)  rotate(-1deg); }
    84%  { transform:translate(-2px,-5px) rotate(.6deg); }
    100% { transform:translate(0,0)       rotate(0); }
  }
  @keyframes floatAmber{
    0%   { transform:translate(0,0)         rotate(0); }
    24%  { transform:translate(2px,3px)     rotate(-.6deg); }
    48%  { transform:translate(-2.5px,3.5px) rotate(.5deg); }
    70%  { transform:translate(-3px,-2px)   rotate(.8deg); }
    88%  { transform:translate(1.5px,-3px)  rotate(-.5deg); }
    100% { transform:translate(0,0)         rotate(0); }
  }
  .bob--blue  { animation:floatBlue  11s ease-in-out -2s infinite; }
  .bob--teal  { animation:floatTeal  9.5s ease-in-out -5s infinite; }
  .bob--amber { animation:floatAmber 13s ease-in-out -1s infinite; }

  /* ---------- Halo breathe (off-phase) ---------- */
  @keyframes breathe{
    from{ transform:scale(1);    opacity:.5; }
    to  { transform:scale(1.07); opacity:.32; }
  }
  .halo--blue  { animation:breathe 5.5s ease-in-out  0s   infinite alternate; }
  .halo--teal  { animation:breathe 4.7s ease-in-out -1.0s infinite alternate; }
  .halo--amber { animation:breathe 6.3s ease-in-out -2.0s infinite alternate; }

  /* ---------- Specular glint — staggered sweep, clipped to disc ---------- */
  @keyframes glintBlue{
    0%   { transform:translateX(-82px) rotate(20deg); opacity:0; }
    3%   { opacity:.9; }
    12%  { transform:translateX(96px)  rotate(20deg); opacity:.9; }
    15%  { transform:translateX(96px)  rotate(20deg); opacity:0; }
    100% { transform:translateX(96px)  rotate(20deg); opacity:0; }
  }
  @keyframes glintTeal{
    0%   { transform:translateX(-60px) rotate(20deg); opacity:0; }
    3%   { opacity:.9; }
    12%  { transform:translateX(72px)  rotate(20deg); opacity:.9; }
    15%  { transform:translateX(72px)  rotate(20deg); opacity:0; }
    100% { transform:translateX(72px)  rotate(20deg); opacity:0; }
  }
  @keyframes glintAmber{
    0%   { transform:translateX(-46px) rotate(20deg); opacity:0; }
    3%   { opacity:.9; }
    12%  { transform:translateX(56px)  rotate(20deg); opacity:.9; }
    15%  { transform:translateX(56px)  rotate(20deg); opacity:0; }
    100% { transform:translateX(56px)  rotate(20deg); opacity:0; }
  }
  .glint--blue  { animation:glintBlue  9s ease-in-out 1.5s infinite backwards; }
  .glint--teal  { animation:glintTeal  9s ease-in-out 4.5s infinite backwards; }
  .glint--amber { animation:glintAmber 9s ease-in-out 7.5s infinite backwards; }

  /* ---------- Accessibility: respect reduced motion ---------- */
  @media (prefers-reduced-motion: reduce){
    .enter, .bob, .halo, .glint{ animation:none !important; }
    .enter{ opacity:1; transform:none; }
    .glint{ opacity:0; }
  }
</style>
</head>
<body>

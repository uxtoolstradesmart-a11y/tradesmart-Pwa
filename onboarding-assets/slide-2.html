<!DOCTYPE html>
<!--
  TradeSmart — "30 Years" badge reveal (standalone, shareable section)
  Layers: #stage #glow (backdrop) · #hero (shield) · gold gleam (masked to gold)
          · #sparks (twinkle) · #confetti (one-shot burst) · #head (caption)
  Motion fires only when #screen has class .anim (so reduced-motion = static final state).
  Angular: paste the <svg>, move <style> to the component scss; restart the intro with
      s.classList.remove('anim'); void s.offsetWidth; s.classList.add('anim');
  Timeline/easing live in :root (--t-* / --e-*).
-->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TradeSmart · 30 Years badge</title>
<style>
  :root{
    --t-stage:.30s; --t-glow:.32s; --t-hero:.50s;
    --t-conf:.95s;  --t-spark:1.15s; --t-gleam:1.85s; --t-head:1.65s;
    --e-spring:cubic-bezier(.34,1.56,.64,1);
    --e-out:cubic-bezier(.16,1,.3,1);
    --surface:#ffffff; --bd:#ffffff; --ink-ui:#3a4252; --chip:#ffffff; --chip-bd:#d7dee8;
  }
  html[data-theme="dark"]{
    --surface:#0E1116; --bd:#0E1116; --ink-ui:#aeb6c4; --chip:#161b22; --chip-bd:#262d38;
  }
  #screen{ --ink:#151E34; --glow:#3F71EB; --stage:#ffffff; }
  html[data-theme="dark"] #screen{ --ink:#E7ECF3; --glow:#5C86F2; --stage:#1B2330; }
  html[data-theme="dark"] #head .hl{ fill:var(--ink); }

  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;gap:20px;padding:0;
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
       color:var(--ink-ui);background:var(--surface);transition:background .4s,color .4s}
  .card{background:transparent;border-radius:24px;padding:0;box-shadow:none}
  html[data-theme="dark"] .card{box-shadow:0 20px 60px -30px rgba(0,0,0,.6)}
  #screen{display:block;width:auto;height:min(72vh,560px);border-radius:18px;background:transparent}

  .controls{display:none!important;gap:10px;align-items:center}
  button{font:inherit;font-weight:600;cursor:pointer;padding:9px 16px;border-radius:11px;
         border:1px solid var(--chip-bd);background:var(--chip);color:var(--ink-ui);
         transition:transform .15s var(--e-out),border-color .2s}
  button:hover{transform:translateY(-1px);border-color:#3F71EB}
  button.primary{background:#3F71EB;border-color:#3F71EB;color:#fff;
                 box-shadow:0 8px 20px -8px rgba(63,113,235,.7)}
  .hint{font-size:12px;opacity:.65}

  /* ---- motion ---- */
  #hero,#head .hl,#stage,#glow,.spark,.conf,#gleamRect{transform-box:fill-box;transform-origin:center}
  #gleamRect{opacity:0}                          /* hidden until its sweep — fixes early shine */
  #screen:not(.anim) .conf{opacity:0}

  #screen.anim #stage{animation:stageIn .8s var(--e-out) var(--t-stage) both}
  #screen.anim #glow{animation:glowIn .9s var(--e-out) var(--t-glow) both,
                              glowBreath 4.8s ease-in-out 1.9s infinite}
  #screen.anim #hero{animation:heroIn 1.05s var(--e-spring) var(--t-hero) both,
                              heroFloat 4.6s ease-in-out 1.9s infinite}
  #screen.anim #gleamRect{animation:gleam 5s linear var(--t-gleam) infinite both}
  #screen.anim .conf{animation:conf 1.1s var(--e-out) calc(var(--t-conf) + var(--i)*.02s) both}
  #screen.anim .spark{animation:spark 2.8s ease-in-out calc(var(--t-spark) + var(--i)*.12s) infinite both}
  #screen.anim #head .hl{animation:wipe .7s var(--e-out) calc(var(--t-head) + var(--i)*.13s) both}

  @keyframes stageIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  @keyframes glowIn{from{opacity:0;transform:scale(.5)}to{opacity:.9;transform:scale(1)}}
  @keyframes glowBreath{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.92;transform:scale(1.06)}}
  @keyframes heroIn{0%{opacity:0;transform:scale(.7) rotate(-5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes wipe{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
  @keyframes spark{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
  @keyframes conf{0%{opacity:0;transform:translate(0,0) scale(0)}
                  18%{opacity:1;transform:translate(calc(var(--dx)*.32),calc(var(--dy)*.32)) scale(1)}
                  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
  /* gleam: invisible at rest + during delay (both), one rake across the gold, then idle off-mask */
  @keyframes gleam{
    0%  {opacity:0; transform:rotate(18deg) translateX(-260px)}
    2%  {opacity:1}
    16% {opacity:1; transform:rotate(18deg) translateX(180px)}
    18% {opacity:0}
    100%{opacity:0; transform:rotate(18deg) translateX(180px)}
  }
  @media (prefers-reduced-motion: reduce){
    #screen.anim *{animation:none !important}
    #screen.anim #glow{opacity:.7} #screen.anim .conf,#screen.anim #gleamRect{opacity:0}
  }
</style>
</head>
